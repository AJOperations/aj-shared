[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aj-shared"
version = "1.4.1"
description = "Shared auth, HQ proxy, and contract-versioning package for AJ internal tools."
requires-python = ">=3.9"
dependencies = [
    "flask>=2.3",
    "flask-cors>=4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110,<1",
    "itsdangerous>=2.1,<3",
    "python-multipart>=0.0.9,<1",
]
dev = [
    "pytest>=8,<9",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
]

[tool.setuptools.packages.find]
include = ["aj_shared*"]
