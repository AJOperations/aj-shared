[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aj-shared"
version = "1.2.1"
description = "Shared auth, HQ proxy, and contract-versioning package for AJ internal tools."
requires-python = ">=3.9"
dependencies = [
    "flask>=2.3",
    "flask-cors>=4.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["aj_shared*"]
