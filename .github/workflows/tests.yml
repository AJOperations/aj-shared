name: tests
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # fastapi/httpx/python-multipart back the FastAPI integration suites;
      # without python-multipart the multipart proxy tests fail on an assert
      # inside starlette rather than on anything in this package.
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest flask fastapi httpx python-multipart
      - run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q
